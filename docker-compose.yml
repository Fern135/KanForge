name: ${COMPOSE_PROJECT_NAME:-kanforge}

# Shared hardening: no privilege escalation, every Linux capability dropped.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-env: &api-env
  NODE_ENV: production
  MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}
  REDIS_URL: redis://app:${REDIS_PASSWORD}@redis:6379/0
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-600}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  APP_ORIGIN: ${APP_ORIGIN}
  COOKIE_SECURE: "true"
  TRUST_PROXY: "1"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Plan for new workspaces: self-hosted (every app, no limits), standard or plus.
  DEFAULT_PLAN: ${DEFAULT_PLAN:-self-hosted}
  # Object storage for the Files app: the garage service below by default, or any
  # S3-compatible service (set S3_ENDPOINT and S3_REGION in .env to use one).
  S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:-kanforge-files}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

# Base images are pinned to exact digests (the tag is kept for reading). Dependabot
# (.github/dependabot.yml) opens a pull request when a newer one is published.
services:
  mongo:
    <<: *hardened
    image: mongo:8.3@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    user: "999:999"
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB}
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_MIGRATE_USER: ${MONGO_MIGRATE_USER}
      MONGO_MIGRATE_PASSWORD: ${MONGO_MIGRATE_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./docker/mongo/init-users.js:/docker-entrypoint-initdb.d/init-users.js:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    <<: *hardened
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    user: "999:1000"
    # ACL: the default user is disabled. The "app" user can run everything
    # except dangerous commands (FLUSHALL, CONFIG, KEYS, DEBUG, ...).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --user
      - default
      - "off"
      - --user
      - app
      - "on"
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
      - "-@dangerous"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user app --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Object storage for the Files app: Garage, a small S3-compatible server. It
  # creates its bucket and access key from the environment on first start
  # (--single-node --default-bucket), so there's nothing to set up by hand. Files
  # live in the garage-data volume; back it up along with MongoDB.
  garage:
    <<: *hardened
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    read_only: true
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-kanforge-files}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    networks: [backend]

  # Runs pending migrations, then exits. The API waits for it to succeed.
  migrate:
    <<: *hardened
    restart: "no"
    build:
      context: ./backend
      target: runtime
    image: kanforge-api:latest
    read_only: true
    environment:
      <<: *api-env
      MONGO_URI: mongodb://${MONGO_MIGRATE_USER}:${MONGO_MIGRATE_PASSWORD}@mongo:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}
    entrypoint: ["node", "node_modules/migrate-mongo/bin/migrate-mongo.js"]
    command: ["up", "-f", "migrate-mongo-config.js"]
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *hardened
    image: kanforge-api:latest
    build:
      context: ./backend
      target: runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment: *api-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_started
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    <<: *hardened
    image: kanforge-web:latest
    build:
      context: ./frontend
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    environment:
      # Where plain-HTTP requests are redirected.
      APP_ORIGIN: ${APP_ORIGIN}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  # Integration test runner (`make test`). It uses an isolated *_test database
  # and Redis DB 1, so it never touches app data.
  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    image: kanforge-api:dev
    environment:
      <<: *api-env
      NODE_ENV: test
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_APP_DB}_test?authSource=admin
      REDIS_URL: redis://app:${REDIS_PASSWORD}@redis:6379/1
      COOKIE_SECURE: "true"
      # Test files go under their own prefix in the bucket, apart from real ones.
      S3_KEY_PREFIX: test/
    command: ["npm", "test"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_started
    networks: [backend]

networks:
  # MongoDB, Redis and Garage live on an internal network with no route to the
  # outside world. Only the API can reach them.
  backend:
    internal: true
  edge:

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  garage-meta:
  garage-data:
