# Opens pull requests when base images or npm packages have updates, including
# the pinned image digests in the Dockerfiles and docker-compose.yml.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: ["/backend", "/frontend"]
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
