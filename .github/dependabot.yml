# Opens pull requests when base images or npm packages have updates, including
# the pinned image digests in the Dockerfiles and docker-compose.yml. They go to
# dev, like every other change, and reach main once they've been tested.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    target-branch: dev
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: dev
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: ["/backend", "/frontend"]
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
