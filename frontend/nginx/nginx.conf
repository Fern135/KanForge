worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  # ES module files (the PDF reader's worker, used for Files previews). Browsers
  # refuse to run a module worker served with any other type.
  types { application/javascript mjs; }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Edge hardening: small bodies, short timeouts.
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # First line of defense against floods. The API applies finer-grained limits in Redis.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/conf.d/*.conf;
}
